<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cámaras en Vivo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f3f7;
            color: #202124;
        }

        /* ENCABEZADO */
        header {
            background: #101a2d;
            color: white;
            text-align: center;
            padding: 35px 15px 30px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 20px;
            color: #d8dce5;
        }

        /* CONTENEDOR */
        .contenedor {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        /* TARJETA DE CÁMARA */
        .camara {
            background: white;
            border-radius: 22px;
            overflow: hidden;
            margin-bottom: 28px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
        }

        /* VIDEO */
        .video {
            height: 430px;
            background: #202b3d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            position: relative;
        }

        .en-vivo {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ef2029;
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
        }

        .video-texto {
            text-align: center;
        }

        /* INFORMACIÓN */
        .info {
            padding: 25px;
        }

        .info h2 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        /* AUSPICIANTES */
        .auspiciantes {
            background: #f5f7fb;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .auspiciantes h3 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 18px;
        }

        /* LOS 3 AUSPICIANTES SIEMPRE HORIZONTALES */
        .logos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }

        .logo {
            height: 100px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px;
            color: white;
            font-weight: bold;
            font-size: 17px;
            line-height: 1.2;
        }

        .logo1 {
            background: #a91414;
        }

        .logo2 {
            background: #15191d;
        }

        .logo3 {
            background: #1453a6;
        }

        /* BOTÓN */
        .boton {
            display: block;
            width: 100%;
            background: #2864e8;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 17px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .boton:hover {
            background: #174fc9;
        }

        /* CÁMARA PRÓXIMAMENTE */
        .proximamente {
            height: 350px;
            background: #202b3d;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
        }

        .proxima-info {
            padding: 25px;
        }

        .proxima-info h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .proxima-info p {
            font-size: 22px;
            color: #777;
        }

        /* PIE */
        footer {
            background: #101a2d;
            color: #d9dce4;
            text-align: center;
            padding: 30px;
            font-size: 20px;
            margin-top: 40px;
        }

        /* CELULAR */
        @media (max-width: 700px) {

            header {
                padding: 30px 10px;
            }

            header h1 {
                font-size: 32px;
            }

            header p {
                font-size: 18px;
            }

            .contenedor {
                padding: 0 10px;
            }

            .video {
                height: 260px;
            }

            .video-texto {
                font-size: 24px;
            }

            .info {
                padding: 20px;
            }

            .info h2 {
                font-size: 27px;
            }

            /* MANTENER LOS 3 AUSPICIANTES EN HORIZONTAL */
            .auspiciantes {
                padding: 15px 10px;
            }

            .auspiciantes h3 {
                font-size: 20px;
                margin-bottom: 15px;
            }

            .logos {
                grid-template-columns: repeat(3, 1fr);
                gap: 7px;
            }

            .logo {
                height: 80px;
                border-radius: 10px;
                font-size: 12px;
                padding: 5px;
            }

            .boton {
                font-size: 20px;
                padding: 16px;
            }

            .proximamente {
                height: 260px;
            }
        }

        /* CELULARES MUY PEQUEÑOS */
        @media (max-width: 380px) {

            .logos {
                gap: 5px;
            }

            .logo {
                height: 70px;
                font-size: 10px;
            }

            .auspiciantes h3 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- ENCABEZADO -->
    <header>
        <h1>📹 Cámaras en Vivo</h1>
        <p>Observá diferentes lugares en tiempo real</p>
    </header>


    <main class="contenedor">

        <!-- ========================= -->
        <!-- CÁMARA 1 -->
        <!-- ========================= -->

        <section class="camara">

            <!-- ÁREA DE LA CÁMARA -->

            <div class="video">

                <div class="en-vivo">
                    🔴 EN VIVO
                </div>

                <div class="video-texto">
                    Cámara en vivo
                </div>

            </div>


            <!-- INFORMACIÓN DE CÁMARA -->

            <div class="info">

                <h2>📍 Cámara 1</h2>


                <!-- ========================= -->
                <!-- AUSPICIANTES -->
                <!-- ========================= -->

                <div class="auspiciantes">

                    <h3>Auspiciado por:</h3>

                    <div class="logos">

                        <!-- COMERCIO 1 -->
                        <div class="logo logo1">
                            COMERCIO<br>
                            1
                        </div>

                        <!-- COMERCIO 2 -->
                        <div class="logo logo2">
                            COMERCIO<br>
                            2
                        </div>

                        <!-- COMERCIO 3 -->
                        <div class="logo logo3">
                            COMERCIO<br>
                            3
                        </div>

                    </div>

                </div>


                <!-- ========================= -->
                <!-- BOTÓN VER CÁMARA -->
                <!-- ========================= -->

                <a href="#" class="boton">
                    ▶ Ver cámara
                </a>

            </div>

        </section>


        <!-- ========================= -->
        <!-- CÁMARA 2 -->
        <!-- ========================= -->

        <section class="camara">

            <div class="proximamente">
                Cámara en vivo
            </div>

            <div class="proxima-info">

                <h2>📍 Cámara 2</h2>

                <p>Próximamente</p>

            </div>

        </section>

    </main>


    <!-- ========================= -->
    <!-- PIE DE PÁGINA -->
    <!-- ========================= -->

    <footer>
        © 2026 Cámaras en Vivo
    </footer>


</body>
</html>
