<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cámaras en Vivo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
            background: #222;
        }

        h1 {
            margin: 0;
        }

        .camera {
            margin: 25px auto;
            max-width: 800px;
            background: #222;
            padding: 15px;
            border-radius: 12px;
        }

        .video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #00a651;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h1>📹 Cámaras en Vivo</h1>
    <p>Observá nuestras cámaras en tiempo real</p>
</header>

<div class="camera">

    <h2>Cámara 1</h2>

    <div class="video">
        TRANSMISIÓN EN VIVO
    </div>

    <button <button onclick="alert('La cámara se está preparando...')">
        Ver cámara
    </button>

</div>

</body>
</html>
